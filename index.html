<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AINCRAD // System Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="grid-bg"></div>

<!-- ===================== LOGIN SCREEN ===================== -->
<main id="loginScreen" class="screen">
  <div class="panel login-panel">
    <span class="bracket tl"></span><span class="bracket tr"></span>
    <span class="bracket bl"></span><span class="bracket br"></span>

    <p class="eyebrow">AINCRAD NETWORK // AUTH GATE</p>
    <h1 class="title">SYSTEM LOGIN</h1>

    <form id="loginForm" autocomplete="off">
      <label class="field">
        <span>SPIELER-ID</span>
        <input id="loginId" type="text" maxlength="6" placeholder="Z. B. K7QX2M" required>
      </label>
      <label class="field">
        <span>PASSWORT</span>
        <input id="loginPassword" type="password" placeholder="••••••••" required>
      </label>
      <button type="submit" class="btn-primary">
        <span>VERBINDEN</span>
      </button>
      <p id="loginError" class="error-text" hidden></p>
    </form>

    <p class="hint">Noch keine ID? Sende <code>?setpasswort &lt;passwort&gt;</code> an den Bot in WhatsApp.</p>
  </div>
</main>

<!-- ===================== GAME HUB ===================== -->
<main id="hubScreen" class="screen" hidden>

  <header class="hud">
    <span class="bracket tl"></span><span class="bracket br"></span>
    <div class="hud-id">
      <p class="eyebrow small">SCHWERTKÄMPFER</p>
      <h2 id="hudName" class="hud-name">—</h2>
    </div>
    <div class="hud-stats">
      <div class="stat-block">
        <span class="stat-label">LEVEL</span>
        <span id="hudLevel" class="stat-value">1</span>
      </div>
      <div class="stat-block xp-block">
        <span class="stat-label">XP</span>
        <div class="xp-bar"><div id="xpFill" class="xp-fill"></div></div>
      </div>
      <div class="stat-block coins-block">
        <span class="stat-label">COL</span>
        <span id="hudCoins" class="stat-value amber">0</span>
      </div>
    </div>
    <button id="logoutBtn" class="btn-ghost">DISCONNECT</button>
  </header>

  <nav class="tabs">
    <button class="tab-btn active" data-game="slot">🎰 SLOTS</button>
    <button class="tab-btn" data-game="blackjack">🃏 BLACKJACK</button>
    <button class="tab-btn" data-game="rps">✊ DUELL</button>
  </nav>

  <!-- SLOTS -->
  <section class="panel game-panel" data-panel="slot">
    <span class="bracket tl"></span><span class="bracket tr"></span><span class="bracket bl"></span><span class="bracket br"></span>
    <p class="eyebrow">GLÜCKSSPIEL-TERMINAL</p>
    <div class="slot-reels">
      <div class="reel" id="reel0">❔</div>
      <div class="reel" id="reel1">❔</div>
      <div class="reel" id="reel2">❔</div>
    </div>
    <label class="field inline">
      <span>EINSATZ</span>
      <input id="slotBet" type="number" value="50" min="1" step="10">
    </label>
    <button id="slotSpin" class="btn-primary"><span>DREHEN</span></button>
    <p id="slotResult" class="result-text"></p>
  </section>

  <!-- BLACKJACK -->
  <section class="panel game-panel" data-panel="blackjack" hidden>
    <span class="bracket tl"></span><span class="bracket tr"></span><span class="bracket bl"></span><span class="bracket br"></span>
    <p class="eyebrow">KARTEN-DUELL GEGEN DEN DEALER</p>

    <div class="bj-row">
      <p class="bj-label">DEALER <span id="bjDealerScore"></span></p>
      <div id="bjDealerHand" class="hand"></div>
    </div>
    <div class="bj-row">
      <p class="bj-label">DU <span id="bjPlayerScore"></span></p>
      <div id="bjPlayerHand" class="hand"></div>
    </div>

    <div class="btn-row">
      <button id="bjStart" class="btn-primary"><span>NEUE RUNDE</span></button>
      <button id="bjHit" class="btn-secondary" disabled><span>ZIEHEN</span></button>
      <button id="bjStand" class="btn-secondary" disabled><span>HALTEN</span></button>
    </div>
    <p id="bjResult" class="result-text"></p>
  </section>

  <!-- RPS -->
  <section class="panel game-panel" data-panel="rps" hidden>
    <span class="bracket tl"></span><span class="bracket tr"></span><span class="bracket bl"></span><span class="bracket br"></span>
    <p class="eyebrow">SCHNELL-DUELL</p>
    <div class="rps-row">
      <button class="rps-btn" data-choice="rock">🪨<br>STEIN</button>
      <button class="rps-btn" data-choice="paper">📄<br>PAPIER</button>
      <button class="rps-btn" data-choice="scissors">✂️<br>SCHERE</button>
    </div>
    <p id="rpsResult" class="result-text"></p>
  </section>

</main>

<script src="app.js"></script>
</body>
</html>
